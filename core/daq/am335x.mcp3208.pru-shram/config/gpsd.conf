# gpsd configuration for QPMU GPS time sync.
# Install to /etc/default/gpsd on the BBB.
#
# Device paths may need adjustment:
#   UART: /dev/ttyS1 (kernel 6.x) or /dev/ttyO1 (kernel 4.x)
#   PPS:  /dev/pps0 or /dev/pps1 — check dmesg | grep pps

START_DAEMON="true"
USBAUTO="false"
DEVICES="/dev/ttyS1 /dev/pps0"
GPSD_OPTIONS="-n"
GPSD_SOCKET="/var/run/gpsd.sock"
