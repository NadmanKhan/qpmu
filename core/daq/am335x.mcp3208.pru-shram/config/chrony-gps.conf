# Chrony refclock config for GPS+PPS time sync.
# Append to /etc/chrony/chrony.conf on the BBB.

# GPS NMEA via gpsd shared memory (coarse, ~200ms accuracy)
refclock SHM 0 refid NMEA offset 0.200 delay 0.2 noselect

# GPS PPS via gpsd shared memory (precise, sub-microsecond)
refclock SHM 2 refid PPS precision 1e-7 poll 0 trust prefer

# BBB has no RTC battery — allow stepping clock on first 3 updates after boot
makestep 1 3

# Logging (optional, useful for debugging)
log tracking measurements statistics
logdir /var/log/chrony
